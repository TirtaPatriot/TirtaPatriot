# Situs statis tirtapatriot.co.id (hasil `astro build`, format direktori: /berita/judul/index.html)
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;

  # pengalihan relatif agar tetap benar di belakang proxy TLS (Traefik/Cloudflare)
  absolute_redirect off;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # alamat lama & domain lain (dibangkitkan dari public/_redirects)
  include /etc/nginx/snippets/redirects.conf;

  # aset berhash dari Astro tidak pernah berubah isinya
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /_redirects {
    return 404;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri $uri/index.html $uri.html =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
